# Alert Rules for SI Relevés Application
groups:
  - name: application_alerts
    interval: 30s
    rules:
      # Backend Alerts
      - alert: BackendDown
        expr: up{job="si-releves-backend"} == 0
        for: 1m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Backend service is down"
          description: "Backend service has been down for more than 1 minute"

      - alert: BackendHighResponseTime
        expr: rate(http_server_requests_seconds_sum{job="si-releves-backend"}[5m]) / rate(http_server_requests_seconds_count{job="si-releves-backend"}[5m]) > 1
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Backend high response time"
          description: "Average response time is above 1 second for 5 minutes"

      - alert: BackendHighMemoryUsage
        expr: (jvm_memory_used_bytes{job="si-releves-backend", area="heap"} / jvm_memory_max_bytes{job="si-releves-backend", area="heap"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Backend high memory usage"
          description: "JVM heap memory usage is above 85% for 5 minutes"

      - alert: BackendHighCPUUsage
        expr: process_cpu_usage{job="si-releves-backend"} > 0.8
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Backend high CPU usage"
          description: "Backend CPU usage is above 80% for 5 minutes"

      - alert: BackendDatabaseConnectionsHigh
        expr: hikari_connections_active{job="si-releves-backend"} > 15
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "High database connections"
          description: "Number of active database connections is above 15"

      # Frontend Alerts (via cAdvisor)
      - alert: FrontendContainerDown
        expr: up{job="cadvisor"} == 0 or container_last_seen{name="si-releves-frontend"} < (time() - 60)
        for: 1m
        labels:
          severity: critical
          service: frontend
        annotations:
          summary: "Frontend container is down"
          description: "Frontend container has been down for more than 1 minute"

      - alert: FrontendHighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{name="si-releves-frontend"}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: frontend
        annotations:
          summary: "Frontend high CPU usage"
          description: "Frontend container CPU usage is above 80% for 5 minutes"

      - alert: FrontendHighMemoryUsage
        expr: (container_memory_usage_bytes{name="si-releves-frontend"} / container_spec_memory_limit_bytes{name="si-releves-frontend"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: frontend
        annotations:
          summary: "Frontend high memory usage"
          description: "Frontend container memory usage is above 85% for 5 minutes"

      # MySQL Alerts
      - alert: MySQLDown
        expr: up{job="mysql"} == 0
        for: 1m
        labels:
          severity: critical
          service: mysql
        annotations:
          summary: "MySQL service is down"
          description: "MySQL exporter is not responding"

      - alert: MySQLHighConnections
        expr: mysql_global_status_threads_connected{job="mysql"} / mysql_global_variables_max_connections{job="mysql"} * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: mysql
        annotations:
          summary: "MySQL high connections"
          description: "MySQL connections are above 80% of max connections"

      - alert: MySQLSlowQueries
        expr: rate(mysql_global_status_slow_queries{job="mysql"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
          service: mysql
        annotations:
          summary: "MySQL slow queries detected"
          description: "More than 10 slow queries per minute detected"

      # Container Alerts (General)
      - alert: ContainerHighCPUUsage
        expr: rate(container_cpu_usage_seconds_total[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: containers
        annotations:
          summary: "Container high CPU usage"
          description: "Container {{ $labels.name }} CPU usage is above 80%"

      - alert: ContainerHighMemoryUsage
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: containers
        annotations:
          summary: "Container high memory usage"
          description: "Container {{ $labels.name }} memory usage is above 85%"

      - alert: ContainerRestarting
        expr: rate(container_start_time_seconds[10m]) > 0
        for: 5m
        labels:
          severity: warning
          service: containers
        annotations:
          summary: "Container restarting frequently"
          description: "Container {{ $labels.name }} is restarting frequently"

      # Prometheus Alerts
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
          service: prometheus
        annotations:
          summary: "Prometheus is down"
          description: "Prometheus monitoring service is down"
