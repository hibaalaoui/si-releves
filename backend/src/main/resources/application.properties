# ===== Configuration Serveur =====
server.port=8080
spring.application.name=si-releves-backend

# ===== Configuration Base de Donn�es MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/si_releves?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Configuration JPA/Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Configuration Logging =====
logging.level.ma.ree.sireleves=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===== Configuration JWT (� venir) =====
jwt.secret=VotreCleSecreteSuperLongueEtComplexePourJWT2024
jwt.expiration=1800000

# ===== Configuration Swagger/OpenAPI =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method